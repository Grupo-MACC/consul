services:
  consul:
    image: consul:1.15
    container_name: consul-1
    hostname: consul-1
    ports:
      - "8500:8500"
      - "8600:8600/udp"
      - "8300:8300"
      - "8301:8301"
      - "8302:8302"
    extra_hosts:
      - "consul-2:10.1.11.41"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - consul1_data:/consul/data
    command: >
      agent -server -ui
      -node=consul-1
      -bootstrap-expect=2
      -client=0.0.0.0
      -bind=0.0.0.0
      -advertise=10.1.11.30
      -retry-join=consul-2
      -datacenter=dc1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  consul1_data:
# =============================================================================
# CONSUL + ADS CAPTURE STACK
# =============================================================================
# Stack para EC2-Consul con sistema de captura de tráfico ADS
#
# Componentes:
#   - Consul: Service Discovery con HTTPS
#   - Zeek: Captura de tráfico de red hacia Consul
#   - Log Shipper: Recibe notificaciones de microservicios
#   - Merger: Procesa ventanas de features y envía al ADS Server
# =============================================================================

services:
  # ============================================
  # CONSUL - Service Discovery con HTTPS
  # ============================================
  consul:
    build:
      context: .
      dockerfile: Dockerfile
    image: consul-tls:1.15
    container_name: consul
    hostname: consul

    ports:
      - "8501:8501"
      - "8600:8600/udp"
      - "8600:8600/tcp"

    entrypoint: ["consul"]
    command: ["agent", "-config-file=/consul/config/consul.hcl"]

    volumes:
      - ./consul.hcl:/consul/config/consul.hcl:ro
      - ./certs:/consul/certs:ro
      - consul-data:/consul/data

    networks:
      consul-net:
        ipv4_address: 172.20.0.2

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "CONSUL_HTTP_ADDR=https://127.0.0.1:8501 CONSUL_CACERT=/consul/certs/ca.pem consul info >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================
  # LOG SHIPPER - Recibe notificaciones de restart
  # ============================================
  log-shipper:
    build:
      context: ./log_shipper
      dockerfile: Dockerfile
    container_name: log-shipper
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - shipper_data:/app/data
    networks:
      - consul-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # ZEEK - Captura de tráfico de red
  # ============================================
  zeek:
    build:
      context: ./zeek
      dockerfile: Dockerfile
    container_name: zeek
    network_mode: host
    privileged: true
    environment:
      - CAPTURE_INTERFACE=${CAPTURE_INTERFACE:-ens5}
      - CONSUL_HOST=${CONSUL_HOST:-10.1.11.40}
      - CONSUL_PORT=${CONSUL_PORT:-8501}
    volumes:
      - zeek_logs:/opt/zeek/logs
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
    restart: unless-stopped
    depends_on:
      consul:
        condition: service_healthy

  # ============================================
  # MERGER - Procesa ventanas y envía al ADS
  # ============================================
  merger:
    build:
      context: ./merger
      dockerfile: Dockerfile
    container_name: merger
    ports:
      - "8082:8082"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ZEEK_LOG_DIR=/opt/zeek/logs
      - SHIPPER_DATA_PATH=/shipper_data
      - WINDOW_SIZE_SECONDS=${WINDOW_SIZE_SECONDS:-60}
      - ADS_SERVER_URL=${ADS_SERVER_URL:-http://10.1.12.10:8083/predict}
      - CONSUL_HOST=${CONSUL_HOST:-10.1.11.40}
      - CONSUL_PORT=${CONSUL_PORT:-8501}
      - CONSUL_SCHEME=${CONSUL_SCHEME:-https}
    volumes:
      - zeek_logs:/opt/zeek/logs:ro
      - shipper_data:/shipper_data:ro
      - ./certs:/certs:ro
    networks:
      - consul-net
    depends_on:
      - log-shipper
      - zeek
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# ============================================
# VOLUMES
# ============================================
volumes:
  consul-data:
  zeek_logs:
  shipper_data:

# ============================================
# NETWORKS
# ============================================
networks:
  consul-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
